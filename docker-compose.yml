# ============================================================================
#  单用户受控部署:app + 可选 Nginx(向量服务二选一)
#  外部向量:
#    1) cp .env.example .env,填 FA_EMBEDDING_URL / MODEL / KEY
#    2) docker compose up -d --build
#  同机本地模型:
#    1) 把 bge-m3 GGUF 放到 ./models/
#    2) docker compose -f docker-compose.yml -f docker-compose.local-embedding.yml up -d --build
#  只有本机 127.0.0.1:8080 可直接访问;对外走 Nginx profile
# ============================================================================

services:
  app:
    build:
      context: .
    image: talk-to-textbook:local
    env_file:
      - .env
    ports:
      # 只绑本机回环:公网必须经过 Nginx,不能绕过代理直连后端
      - "127.0.0.1:8080:8080"
    volumes:
      # 程序与数据分离;更新镜像不会覆盖这些目录
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./dict:/app/dict
    mem_limit: ${APP_MEM_LIMIT:-2g}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
