<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formal Agent · 教材问答</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
    <h1>📘 Formal Agent</h1>
    <p class="sub">把教材变成「会自己查资料」的问答助手</p>
</header>

<main>
    <!-- ==================== 会话栏 ==================== -->
    <aside class="convs card">
        <div class="convs-head">
            <h2>对话</h2>
            <button id="newConv" type="button" class="mini new" title="新建一个对话(记忆独立)">＋ 新建</button>
        </div>
        <div id="convList" class="conv-list">加载中…</div>
        <button id="openMemory" type="button" class="mini mem-btn" title="看看这个对话记住了什么">🧠 记忆</button>
        <p class="conv-note muted small">每个对话的记忆互相独立。</p>
    </aside>

    <!-- ==================== 对话区 ==================== -->
    <section class="card chat">
        <div id="messages" class="messages">
            <div class="bubble bot">
                你好!我是教材问答助手。直接提问,或者上传题目图片(一次最多 10 张)—— 我会自己去知识库里查资料,再回答你。每个对话各自独立记忆,想另起一个话题就点左上角「＋ 新建」。
            </div>
        </div>

        <!-- 已选图片的缩略图区:每张右上角的 × 可以自己删掉 -->
        <div id="previews" class="previews" hidden>
            <div id="thumbs" class="thumbs"></div>
            <div class="preview-bar">
                <span id="imgCount" class="muted small">0 / 10</span>
                <span id="previewMsg" class="hint"></span>
                <button id="clearImages" type="button" class="link-btn">清空全部</button>
            </div>
        </div>

        <form id="ask-form" class="composer">
            <input id="question" type="text" placeholder="例如:沿闭合曲线跑一圈回到原点,位移是多少?" autocomplete="off">
            <label class="icon-btn" id="pickLabel" title="上传图片提问(最多 10 张)">
                🖼️<input id="images" type="file" accept="image/*" multiple hidden>
            </label>
            <button id="send" type="submit">提问</button>
        </form>
    </section>

    <!-- ==================== 侧栏 ==================== -->
    <aside class="side">
        <div class="card">
            <h2>知识库</h2>
            <div id="kb" class="muted">加载中…</div>
        </div>

        <div class="card contact-cta">
            <p>没有找到教材?<a class="contact-btn" href="/contact.html">点击这里联系开发者</a></p>
        </div>
    </aside>
</main>

<!-- ==================== 长期记忆抽屉 ==================== -->
<div id="memoryModal" class="modal" hidden>
    <div class="modal-box card">
        <div class="modal-head">
            <h2>🧠 这个对话记住的事</h2>
            <button id="closeMemory" type="button" class="mini">关闭</button>
        </div>
        <p class="mem-tip muted small">
            助手会在后台把值得记的事攒起来。这里能看见、能改、能删 —— 标了 📌 的不会被自动清理(满了先淘汰最久没用到的那条)。
        </p>
        <div class="mem-add">
            <input id="memText" type="text" placeholder="手动记住一件事,例如:我叫鹏哥,在准备 Java 实习面试" autocomplete="off">
            <button id="memAdd" type="button">记住</button>
        </div>
        <div id="memList" class="mem-list">加载中…</div>
        <div class="mem-foot">
            <button id="memExport" type="button" class="mini">导出 JSON</button>
            <button id="memForgetAll" type="button" class="mini danger">忘掉全部</button>
        </div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
