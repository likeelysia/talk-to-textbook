## ============================================================================
##  Talk to Textbook 配置(Spring Boot 自动从 classpath 根读取 application.yml)
##  · fa.* 前缀绑定到 AppConfig(@ConfigurationProperties)
##  · ${ENV_VAR:默认值} 写法 = 允许用环境变量覆盖
## ============================================================================
spring:
  application:
    name: talk-to-textbook
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ---- 静态资源缓存 ----
  # 前端改了 JS/CSS,浏览器却还拿旧的(得 Ctrl+F5 才生效)—— 就是因为没设这个头。
  # no-cache ≠ 不缓存,而是**每次都用 Last-Modified 跟服务端核对**:没变就 304(几乎无开销),
  # 变了立刻拿到新的。想彻底试验可改成 no-store: true(每次都整份重下)。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  # ---- 文件上传上限 ----
  # 不配这段就是 Spring Boot 默认(单文件 1MB / 整请求 10MB)→ 灌教材必报 HTTP 413
  servlet:
    multipart:
      max-file-size: ${FA_MAX_FILE_SIZE:100MB}         # 单个文件
      max-request-size: ${FA_MAX_REQUEST_SIZE:120MB}   # 整个请求(多图 / 多文件一起算)
      file-size-threshold: 1MB                         # 超 1MB 就落临时文件,不整个读进堆内存

server:
  port: 8080          # HTTP 接口端口(可用 --server.port=xxxx 覆盖)
  shutdown: graceful
  # native: 用 Tomcat RemoteIpValve 解析代理头,只信任 internal-proxies 里的代理;
  # 不用 framework(它会信任任意客户端伪造的 X-Forwarded-For)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${FA_TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\..*|172\\.(1[6-9]|2\\d|3[01])\\..*|127\\.0\\.0\\.1|::1}"
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # 本地 HTTP 演练用 false;正式 HTTPS 部署设为 true
        secure: ${FA_COOKIE_SECURE:false}

fa:
  debug: false

  # ---- 单用户登录(Spring Security)----
  # username: 登录名
  # password-hash: BCrypt 哈希(推荐,部署用)
  # password: 明文口令(只从环境变量读,启动时编码进内存,不落盘;适合本地演练)
  auth:
    username: ${FA_AUTH_USERNAME:pengge}
    password: ${FA_AUTH_PASSWORD:}
    password-hash: ${FA_AUTH_PASSWORD_HASH:}

  # ---- 统一上下文预算(字符,粗略≈token;第一版按 1 字≈1 token 保守估算)----
  # max-chars: 核心档案 + 长期记忆 + 摘要 + 最近历史 + 当前问题的总预算
  # reserve-chars: 给最终回答预留的空间
  # tool-result-max-chars: 单条工具结果回灌上限,超了截断
  context:
    max-chars: ${FA_CONTEXT_MAX_CHARS:14000}
    reserve-chars: ${FA_CONTEXT_RESERVE_CHARS:3000}
    tool-result-max-chars: ${FA_TOOL_RESULT_MAX_CHARS:6000}

  # ---- 流式问答资源边界(小机器别让无限线程把内存吃光)----
  stream:
    workers: ${FA_STREAM_WORKERS:4}
    queue: ${FA_STREAM_QUEUE:8}

  # ---- 模型请求并发边界:所有文字/视觉/摘要/记忆提炼共用一个总预算 ----
  model:
    max-concurrent: ${FA_MODEL_MAX_CONCURRENT:2}
    # 后台提炼最多占几个总名额;保证至少一个留给交互
    background-concurrent: ${FA_MODEL_BACKGROUND_CONCURRENT:1}
    # 等名额的上限;超时回 503
    acquire-timeout-seconds: ${FA_MODEL_ACQUIRE_TIMEOUT_SECONDS:10}

  # ---- 问答接口限流(每个会话/IP 每分钟)----
  rate-limit:
    per-minute: ${FA_RATE_LIMIT_PER_MINUTE:12}

  # ---- 背词工具(词典外置,不打包进 jar)----
  # dict-path: ECDICT 的 stardict.db 路径;默认项目下 dict/stardict.db
  # max-words: 单篇文章最多提取多少个单词,防止粘贴整本书
  vocab:
    dict-path: ${FA_VOCAB_DICT:dict/stardict.db}
    max-words: ${FA_VOCAB_MAX_WORDS:5000}
    # 学习档案独立于可衰减的 Agent 记忆；默认包含在 data/ 备份中
    notebook-file: ${FA_VOCAB_NOTEBOOK_FILE:data/vocab/notebook.json}

  # ---- 调用 LLM 的通用参数(超时 / 重试)----
  llm:
    request-timeout-seconds: 120
    connect-timeout-seconds: 30
    # 流式响应体:总时限从发请求算起;空闲时限只看 data: 事件,心跳注释不算
    stream-idle-timeout-seconds: ${FA_STREAM_IDLE_TIMEOUT_SECONDS:60}
    stream-total-timeout-seconds: ${FA_STREAM_TOTAL_TIMEOUT_SECONDS:300}
    max-attempts: 5
    retry-base-ms: 2000
    retry-max-ms: 20000

  # ---- DeepSeek:文本对话 / 知识点提炼 ----
  deepseek:
    api-url: ${FA_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    model: ${FA_DEEPSEEK_MODEL:deepseek-chat}
    # 密钥:api-key 直接写值(优先);留空则读 api-key-env 指的那个环境变量
    api-key: ${FA_DEEPSEEK_API_KEY:}
    api-key-env: ${FA_DEEPSEEK_KEY_ENV:DEEPSEEK_API_KEY}
    max-tokens: ${FA_DEEPSEEK_MAX_TOKENS:8192}

  # ---- 视觉模型:PDF 扫描件 OCR / 图片问答 ----
  #   任何「OpenAI 兼容」的视觉模型都能接,换厂商 = 改这几行(代码不动):
  #     · 阿里百炼  api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  #                 model: qwen-vl-max        api-key-env: DASHSCOPE_API_KEY   extra-body-json: ''
  #     · 智谱 GLM-4V  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions   model: glm-4v-plus
  #     · 火山方舟豆包  api-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions   model: <接入点 id>
  #     · 本地 Ollama  api-url: http://127.0.0.1:11434/v1/chat/completions   model: qwen2.5vl   extra-body-json: ''
  #   也可以不动这里的默认值,直接用现成的 profile 预设(文件末尾 qwen / ollama)
  vision:
    api-url: ${FA_VISION_URL:https://api.moonshot.cn/v1/chat/completions}
    model: ${FA_VISION_MODEL:kimi-k2.6}
    # 显示名:只用于日志和 /api/health 上报
    provider: ${FA_VISION_PROVIDER:Kimi}
    # 密钥:api-key 直接写值(优先);留空则读 api-key-env 指的那个环境变量
    api-key: ${FA_VISION_API_KEY:}
    api-key-env: ${FA_VISION_KEY_ENV:MOONSHOT_API_KEY}
    max-tokens: ${FA_VISION_MAX_TOKENS:4096}
    # 厂商专属请求字段(JSON 文本),原样合并进请求体。
    #   K2.6 需要关掉思考(照抄任务不需要“想”);换厂商就改成对方要的字段,不需要就写 ''(空)。
    #   用字符串而不是嵌套结构:profile 覆盖时能整段替换;写错的话启动就报错。
    extra-body-json: '{"thinking":{"type":"disabled"}}'

  # ---- OCR 引擎(扫描件/影印版 PDF 用)----
  #   engine: vision(远程多模态视觉模型,准、能读公式,但慢且有限流)
  #           rapid (本地 RapidOCR/PP-OCRv4,快、离线、零成本,公式是弱项)
  ocr:
    engine: ${FA_OCR_ENGINE:vision}
    # 主引擎读得可疑(或直接失败)时,自动换下面这个引擎重读一遍
    fallback-to-vision: ${FA_OCR_FALLBACK_VISION:true}
    # 兜底引擎是谁也由配置说了算(不再硬认某个名字);旧名 kimi / moonshot 仍作为别名认到 vision
    fallback-engine: ${FA_OCR_FALLBACK_ENGINE:vision}
    vision:
      # 页间最小间隔(毫秒):语义是「两次调用的开始时刻至少相隔这么久」
      #   默认 1500 = 只躲「组织并发 = 1」;撞 429(组织级 3 RPM)时调成 21000(60 秒内最多 3 次)
      #   ⚠️ 旧名 fa.ocr.kimi.page-gap-ms 仍然认(两个都写了的话,新名优先)
      page-gap-ms: ${FA_OCR_PAGE_GAP_MS:1500}
    # 去噪:OCR 结果里只要有一行包含其中任一关键字,整行丢掉(扫描 App 的水印)
    #   逗号 / 分号 / 竖线分隔;留空 = 不过滤
    watermark-lines: ${FA_OCR_WATERMARK_LINES:夸克扫描王,极速扫描,就是高效}
    rapid:
      # CPU 线程数;<=0 = 按机器核数自动
      num-threads: ${FA_OCR_THREADS:0}
      # 按长边缩放;0 = 不缩放(最清晰也最慢)
      max-side-len: ${FA_OCR_MAX_SIDE_LEN:0}
    # “体检”阈值:不达标就认为本地读糊了 → 回退兜底引擎
    quality:
      min-chars: ${FA_OCR_MIN_CHARS:30}
      min-chinese-ratio: ${FA_OCR_MIN_CHINESE_RATIO:0.2}

  # ---- embedding 服务:本地 llama.cpp 或任意 OpenAI 兼容云端服务 ----
  embedding:
    url: ${FA_EMBEDDING_URL:http://127.0.0.1:8090}
    # 多语言(中英)embedding:换模型 = 向量指纹变 → 旧 base.vectors.json 自动作废重算
    model: ${FA_EMBEDDING_MODEL:bge-m3}
    # 云端服务需要 Bearer;本地 llama-server 留空
    api-key: ${FA_EMBEDDING_API_KEY:}
    # OpenAI 兼容端点的路径(默认 /v1/embeddings);百炼请按控制台完整路径配置,避免重复 /v1
    embeddings-path: ${FA_EMBEDDING_PATH:/v1/embeddings}
    # HTTP 子批大小;百炼 v4 建议 10 或更小,持久化批次另由补齐接口控制
    batch-size: ${FA_EMBEDDING_BATCH_SIZE:16}
    # 期望维度;0=不校验。v4 固定 1024 时建议显式设为 1024
    dimensions: ${FA_EMBEDDING_DIMENSIONS:0}
    # 429/5xx 有上限重试;401/403/参数错误不重试
    max-attempts: ${FA_EMBEDDING_MAX_ATTEMPTS:3}
    retry-base-ms: ${FA_EMBEDDING_RETRY_BASE_MS:500}
    # 健康探测路径;云端没有 /health 就留空(/api/health 显示 UNKNOWN,不假装 UP)
    health-path: ${FA_EMBEDDING_HEALTH_PATH:/health}
    # 单次 embedding 请求超时(秒)
    timeout-seconds: ${FA_EMBEDDING_TIMEOUT_SECONDS:20}

  # ---- 知识库 ----
  knowledge:
    file: ${FA_KNOWLEDGE_FILE:knowledge/base.json}
    # 混合检索的相似度阈值:低于它就当作“没找到”(0=不过滤)。调大更保守、调小更容易命中。
    min-score: ${FA_KNOWLEDGE_MIN_SCORE:0.45}

  # ---- 客户端上传的教材落盘目录 ----
  upload:
    dir: ${FA_UPLOAD_DIR:data/uploads}

  # ---- 会话(对话框):一个会话一个 JSON 文件 + 一份 index.json 列表 ----
  conversation:
    dir: ${FA_CONVERSATION_DIR:data/conversations}

  # ---- 笔记本(「存笔记」功能)----
  #   跨会话全局一本:用户勾选自己的提问 → 连同「AI 对这一问的相关回答」一起存进来
  note:
    dir: ${FA_NOTE_DIR:data/notes}

  # ---- 记忆(短期 = 会话内上下文窗口;长期 = 跨轮累积的事实 / 偏好)----
  #   模型本身不会“记得”上一句 —— 每次请求都得把“之前聊过什么”重新喂给它。
  #   全量喂会越聊越贵(而且越聊越跑题),所以只带“最近几轮原文”,更早的压成一段摘要。
  memory:
    short-term:
      # 最多带最近几轮原文(1 轮 = 一条提问 + 它的回答)
      max-turns: ${FA_MEMORY_MAX_TURNS:6}
      # 原文的字符预算(粗略≈token;中文 1 字 ≈ 1~2 token)
      max-chars: ${FA_MEMORY_MAX_CHARS:6000}
      # 被挤出窗口的旧对话:true = 压成滚动摘要(存进会话的 summary);false = 直接丢
      summarize: ${FA_MEMORY_SUMMARIZE:true}
    # 长期记忆:攒够几轮就在后台提炼一次,存 data/memory/<记忆域>.json
    long-term:
      enabled: ${FA_MEMORY_LONG_TERM:true}
      dir: ${FA_MEMORY_DIR:data/memory}
      # 攒够几轮提炼一次(1 轮 = 一条提问 + 它的回答)
      extract-every-turns: ${FA_MEMORY_EXTRACT_TURNS:6}
      # 模型打分低于它就丢掉(0 = 全留)
      keep-score: ${FA_MEMORY_KEEP_SCORE:0.5}
      # 每次提问最多召回几条带进上下文
      recall-top-k: ${FA_MEMORY_RECALL_TOP_K:5}
      # 召回最低相关度:低于它的不注入,允许本轮 0 条(不再按时间补满)
      # 默认 0.30 由 MemoryRecallCalibrationTest 的小样本标定;真实数据不同就调这个值
      recall-min-score: ${FA_MEMORY_RECALL_MIN_SCORE:0.30}
      # 两条记忆余弦相似度超过它就当成同一件事,合并成一条
      dedup-similarity: ${FA_MEMORY_DEDUP:0.9}
      # 一次提炼最多入库几条
      max-items: ${FA_MEMORY_MAX_ITEMS:5}
      # 一个记忆域最多存几条:超了就淘汰“最久没被召回”的(钉住的、用户自己加的不淘汰);<=0 = 用默认值(500)
      max-stored: ${FA_MEMORY_MAX_STORED:500}
      # 一轮对话短于这么多字就不送去提炼(寒暄 / 确认)
      min-chars: ${FA_MEMORY_MIN_CHARS:20}
      # 记忆对账:true = 新记忆先跟旧记忆比,决定 加/改/删/不动(多一次模型调用)
      reconcile: ${FA_MEMORY_RECONCILE:true}
    # 核心档案(全局一份,每轮注入;人话:贴在显示器边上的便签)
    core:
      path: ${FA_MEMORY_CORE:data/memory/core.md}
      max-chars: ${FA_MEMORY_CORE_MAX_CHARS:800}
    # 核心档案冲突的待确认记录(只提示,不自动改档案)
    conflicts-path: ${FA_MEMORY_CONFLICTS:data/memory/conflicts.json}

  # ---- 教材切块 / 灌库断点 ----
  extract:
    chunk-size: 800
    overlap: 100
    # 灌库断点粒度:每 N 页完成一次“提炼 + 落盘”(断了重跑就从这里续)
    block-size: ${FA_INGEST_BLOCK_SIZE:40}

  # ---- 灌库断点(进度文件)目录 ----
  checkpoint:
    dir: ${FA_CHECKPOINT_DIR:data/checkpoints}

  # ---- 图片问答检索条数 ----
  qa:
    top-k: 5

  # ---- 安全:管理接口密钥(为空 = 关闭鉴权,仅适合本地开发)----
  security:
    admin-key: ${FA_ADMIN_KEY:}

---
## ============================================================================
##  dev profile:--spring.profiles.active=dev
##  用法示例:java -jar app.jar --spring.profiles.active=dev
## ============================================================================
spring:
  config:
    activate:
      on-profile: dev
fa:
  debug: true

---
## ============================================================================
##  视觉模型预设 —— 换厂商不改代码,只换 profile:
##      java -jar app.jar --spring.profiles.active=qwen
##  与 dev 可叠加:--spring.profiles.active=dev,qwen
##  只覆盖 fa.vision.*,其余配置照旧(记得先把对应厂商的密钥配好)
## ============================================================================
spring:
  config:
    activate:
      on-profile: qwen
fa:
  vision:
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    model: qwen-vl-max
    provider: Qwen-VL
    api-key-env: DASHSCOPE_API_KEY
    extra-body-json: ''          # 通义千问不需要 thinking 字段(整段清掉)

---
## 本地 Ollama:完全离线、不花钱(先拉模型:ollama pull qwen2.5vl)
## ⚠️ 本地小模型的公式识别质量明显不如云端大模型 —— 先拿几页公式页对拍再量产
spring:
  config:
    activate:
      on-profile: ollama
fa:
  vision:
    api-url: http://127.0.0.1:11434/v1/chat/completions
    model: qwen2.5vl
    provider: Ollama
    api-key: ollama             # 本地服务不校验密钥,但请求头得有个值
    extra-body-json: ''
