## ============================================================================
##  Formal Agent 配置(Spring Boot 自动从 classpath 根读取 application.yml)
##  · fa.* 前缀绑定到 AppConfig(@ConfigurationProperties)
##  · ${ENV_VAR:默认值} 写法 = 允许用环境变量覆盖
## ============================================================================
spring:
  application:
    name: formal-agent

  # ---- 文件上传上限 ----
  # 不配这段就是 Spring Boot 默认(单文件 1MB / 整请求 10MB)→ 灌教材必报 HTTP 413
  servlet:
    multipart:
      max-file-size: ${FA_MAX_FILE_SIZE:100MB}         # 单个文件
      max-request-size: ${FA_MAX_REQUEST_SIZE:120MB}   # 整个请求(多图 / 多文件一起算)
      file-size-threshold: 1MB                         # 超 1MB 就落临时文件,不整个读进堆内存

server:
  port: 8080          # HTTP 接口端口(可用 --server.port=xxxx 覆盖)

fa:
  debug: false

  # ---- 调用 LLM 的通用参数(超时 / 重试)----
  llm:
    request-timeout-seconds: 120
    connect-timeout-seconds: 30
    max-attempts: 5
    retry-base-ms: 2000
    retry-max-ms: 20000

  # ---- DeepSeek:文本对话 / 知识点提炼 ----
  deepseek:
    api-url: https://api.deepseek.com/chat/completions
    model: deepseek-chat
    max-tokens: 8192

  # ---- Kimi 视觉:PDF 扫描件 OCR / 图片问答 ----
  vision:
    api-url: https://api.moonshot.cn/v1/chat/completions
    model: kimi-k2.6
    max-tokens: 4096

  # ---- OCR 引擎(扫描件/影印版 PDF 用)----
  #   engine: kimi(远程视觉模型,准、能读公式,但慢且有组织级 3 RPM 限流)
  #           rapid(本地 RapidOCR/PP-OCRv4,快、离线、零成本,公式是弱项)
  ocr:
    engine: ${FA_OCR_ENGINE:kimi}
    # 本地读得可疑(或直接失败)时,自动换 kimi 把这一页重读一遍
    fallback-to-kimi: ${FA_OCR_FALLBACK_KIMI:true}
    kimi:
      # 页间最小间隔(毫秒):语义是「两次调用的开始时刻至少相隔这么久」
      #   默认 1500 = 只躲「组织并发 = 1」;撞 429(组织级 3 RPM)时调成 21000(60 秒内最多 3 次)
      page-gap-ms: ${FA_OCR_PAGE_GAP_MS:1500}
    # 去噪:OCR 结果里只要有一行包含其中任一关键字,整行丢掉(扫描 App 的水印)
    #   逗号 / 分号 / 竖线分隔;留空 = 不过滤
    watermark-lines: ${FA_OCR_WATERMARK_LINES:夸克扫描王,极速扫描,就是高效}
    rapid:
      # CPU 线程数;<=0 = 按机器核数自动
      num-threads: ${FA_OCR_THREADS:0}
      # 按长边缩放;0 = 不缩放(最清晰也最慢)
      max-side-len: ${FA_OCR_MAX_SIDE_LEN:0}
    # “体检”阈值:不达标就认为本地读糊了 → 回退 kimi
    quality:
      min-chars: ${FA_OCR_MIN_CHARS:30}
      min-chinese-ratio: ${FA_OCR_MIN_CHINESE_RATIO:0.2}

  # ---- 本地 embedding 服务(llama.cpp llama-server)----
  embedding:
    url: ${FA_EMBEDDING_URL:http://127.0.0.1:8090}
    model: bge-small-zh-v1.5

  # ---- 知识库 ----
  knowledge:
    file: ${FA_KNOWLEDGE_FILE:knowledge/base.json}
    # 混合检索的相似度阈值:低于它就当作“没找到”(0=不过滤)。调大更保守、调小更容易命中。
    min-score: ${FA_KNOWLEDGE_MIN_SCORE:0.35}

  # ---- 客户端上传的教材落盘目录 ----
  upload:
    dir: ${FA_UPLOAD_DIR:data/uploads}

  # ---- 会话(对话框):一个会话一个 JSON 文件 + 一份 index.json 列表 ----
  conversation:
    dir: ${FA_CONVERSATION_DIR:data/conversations}

  # ---- 记忆(短期 = 会话内上下文窗口;长期 = 跨轮累积的事实 / 偏好)----
  #   模型本身不会“记得”上一句 —— 每次请求都得把“之前聊过什么”重新喂给它。
  #   全量喂会越聊越贵(而且越聊越跑题),所以只带“最近几轮原文”,更早的压成一段摘要。
  memory:
    short-term:
      # 最多带最近几轮原文(1 轮 = 一条提问 + 它的回答)
      max-turns: ${FA_MEMORY_MAX_TURNS:6}
      # 原文的字符预算(粗略≈token;中文 1 字 ≈ 1~2 token)
      max-chars: ${FA_MEMORY_MAX_CHARS:6000}
      # 被挤出窗口的旧对话:true = 压成滚动摘要(存进会话的 summary);false = 直接丢
      summarize: ${FA_MEMORY_SUMMARIZE:true}
    # 长期记忆:攒够几轮就在后台提炼一次,存 data/memory/<记忆域>.json
    long-term:
      enabled: ${FA_MEMORY_LONG_TERM:true}
      dir: ${FA_MEMORY_DIR:data/memory}
      # 攒够几轮提炼一次(1 轮 = 一条提问 + 它的回答)
      extract-every-turns: ${FA_MEMORY_EXTRACT_TURNS:6}
      # 模型打分低于它就丢掉(0 = 全留)
      keep-score: ${FA_MEMORY_KEEP_SCORE:0.5}
      # 每次提问最多召回几条带进上下文
      recall-top-k: ${FA_MEMORY_RECALL_TOP_K:5}
      # 两条记忆余弦相似度超过它就当成同一件事,合并成一条
      dedup-similarity: ${FA_MEMORY_DEDUP:0.9}
      # 一次提炼最多入库几条
      max-items: ${FA_MEMORY_MAX_ITEMS:5}
      # 一个记忆域最多存几条:超了就淘汰“最久没被召回”的(钉住的、用户自己加的不淘汰);<=0 = 用默认值(500)
      max-stored: ${FA_MEMORY_MAX_STORED:500}
      # 一轮对话短于这么多字就不送去提炼(寒暄 / 确认)
      min-chars: ${FA_MEMORY_MIN_CHARS:20}

  # ---- 教材切块 / 灌库断点 ----
  extract:
    chunk-size: 800
    overlap: 100
    # 灌库断点粒度:每 N 页完成一次“提炼 + 落盘”(断了重跑就从这里续)
    block-size: ${FA_INGEST_BLOCK_SIZE:40}

  # ---- 灌库断点(进度文件)目录 ----
  checkpoint:
    dir: ${FA_CHECKPOINT_DIR:data/checkpoints}

  # ---- 图片问答检索条数 ----
  qa:
    top-k: 5

  # ---- 安全:管理接口密钥(为空 = 关闭鉴权,仅适合本地开发)----
  security:
    admin-key: ${FA_ADMIN_KEY:}

---
## ============================================================================
##  dev profile:--spring.profiles.active=dev
##  用法示例:java -jar app.jar --spring.profiles.active=dev
## ============================================================================
spring:
  config:
    activate:
      on-profile: dev
fa:
  debug: true
