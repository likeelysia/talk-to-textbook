## ============================================================================
##  Formal Agent 配置(Spring Boot 自动从 classpath 根读取 application.yml)
##  · fa.* 前缀绑定到 AppConfig(@ConfigurationProperties)
##  · ${ENV_VAR:默认值} 写法 = 允许用环境变量覆盖
## ============================================================================
spring:
  application:
    name: formal-agent

  # ---- 文件上传上限 ----
  # 不配这段就是 Spring Boot 默认(单文件 1MB / 整请求 10MB)→ 灌教材必报 HTTP 413
  servlet:
    multipart:
      max-file-size: ${FA_MAX_FILE_SIZE:100MB}         # 单个文件
      max-request-size: ${FA_MAX_REQUEST_SIZE:120MB}   # 整个请求(多图 / 多文件一起算)
      file-size-threshold: 1MB                         # 超 1MB 就落临时文件,不整个读进堆内存

server:
  port: 8080          # HTTP 接口端口(可用 --server.port=xxxx 覆盖)

fa:
  debug: false

  # ---- 调用 LLM 的通用参数(超时 / 重试)----
  llm:
    request-timeout-seconds: 120
    connect-timeout-seconds: 30
    max-attempts: 5
    retry-base-ms: 2000
    retry-max-ms: 20000

  # ---- DeepSeek:文本对话 / 知识点提炼 ----
  deepseek:
    api-url: https://api.deepseek.com/chat/completions
    model: deepseek-chat
    max-tokens: 8192

  # ---- Kimi 视觉:PDF 扫描件 OCR / 图片问答 ----
  vision:
    api-url: https://api.moonshot.cn/v1/chat/completions
    model: kimi-k2.6
    max-tokens: 4096

  # ---- 本地 embedding 服务(llama.cpp llama-server)----
  embedding:
    url: ${FA_EMBEDDING_URL:http://127.0.0.1:8090}
    model: bge-small-zh-v1.5

  # ---- 知识库 ----
  knowledge:
    file: ${FA_KNOWLEDGE_FILE:knowledge/base.json}
    # 混合检索的相似度阈值:低于它就当作“没找到”(0=不过滤)。调大更保守、调小更容易命中。
    min-score: ${FA_KNOWLEDGE_MIN_SCORE:0.35}

  # ---- 客户端上传的教材落盘目录 ----
  upload:
    dir: ${FA_UPLOAD_DIR:data/uploads}

  # ---- 教材切块 ----
  extract:
    chunk-size: 800
    overlap: 100

  # ---- 图片问答检索条数 ----
  qa:
    top-k: 5

  # ---- 安全:管理接口密钥(为空 = 关闭鉴权,仅适合本地开发)----
  security:
    admin-key: ${FA_ADMIN_KEY:}

---
## ============================================================================
##  dev profile:--spring.profiles.active=dev
##  用法示例:java -jar app.jar --spring.profiles.active=dev
## ============================================================================
spring:
  config:
    activate:
      on-profile: dev
fa:
  debug: true
